[project]
name = "fabric-performance-benchmark"
version = "0.1.0"
description = "A benchmarking framework for comparing data processing engines (Pandas, PySpark, Polars, DuckDB) on Microsoft Fabric."
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipykernel",
    "nbformat",
    "plotly",
    "polars",
    "pytest",
    "azure-identity",
    "deltalake",
    "numpy",
    "pandas>=3.0.0",
    "pyarrow>=23.0.0",
    "kaleido>=1.2.0",
    "nbconvert>=7.17.0",
    "requests>=2.31.0",
    "tabulate>=0.9.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onelake_tools", "src/fabric_admin"]
